<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Cheers</title>
<meta name="description" content="Rate your drinks. Share them with friends. Take a photo of your drink, give it a rating, and see what your friends are having.">
<meta property="og:title" content="Cheers">
<meta property="og:description" content="Rate your drinks. Share them with friends.">
<meta property="og:image" content="https://cheers-drinks.co.uk/share.png">
<meta property="og:url" content="https://cheers-drinks.co.uk/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { color-scheme: light; --page: #F5F5F5; --card: #FFFFFF; --text: #111111; --muted: #6B6B6B; --line: #E4E4E4; --tile: #F0F0F0; --on: #FFFFFF;
  --ring: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.05);
  --lift: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px -22px rgba(0,0,0,.22); }
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 88px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--page); color: var(--text); font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
img { display: block; max-width: 100%; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
.wm { font: italic 600 22px Fraunces, Georgia, serif; letter-spacing: -.5px; text-decoration: none; }

/* The top bar: a small capsule that stays in view. */
.cap { position: sticky; top: 12px; z-index: 5; width: fit-content; margin: 16px auto 0; height: 52px; padding: 0 24px 0 20px; border-radius: 999px; background: var(--card); box-shadow: var(--ring), var(--lift); display: flex; align-items: center; gap: 28px; }
.cap a:not(.wm):not(.get) { font-size: 14px; font-weight: 500; color: var(--muted); text-decoration: none; }
.cap a:not(.wm):not(.get):hover { color: var(--text); }
.cap.has-get { padding-right: 8px; }
.get { display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: var(--text); color: var(--on); font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.get.big { height: 52px; padding: 0 28px; font-size: 16px; }
a:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; border-radius: 8px; }

.tag { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--tile); font-size: 13px; font-weight: 600; white-space: nowrap; }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
h1 { font-size: clamp(32px, 6.4vw, 64px); line-height: 1.04; letter-spacing: -.035em; font-weight: 700; text-wrap: balance; }
h2 { font-size: clamp(24px, 3.6vw, 36px); letter-spacing: -.025em; line-height: 1.1; text-wrap: balance; }
.lead { font-size: clamp(16px, 2vw, 19px); color: var(--muted); max-width: 30em; text-wrap: pretty; }

.hero { text-align: center; padding-top: 56px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.window { align-self: stretch; margin-top: 32px; background: var(--card); border-radius: 28px; box-shadow: var(--lift); display: flex; justify-content: center; align-items: flex-end; gap: 32px; padding: 48px 24px; }
section { padding-top: 72px; }

/* A real screenshot inside the iPhone frame. The screen opening matches an
   iPhone Pro screenshot (1206 by 2622), so one fits without cropping. */
.ph { width: 232px; max-width: 100%; aspect-ratio: 1350 / 2760; flex: none; position: relative; }
.window .ph { filter: drop-shadow(0 20px 20px rgba(0,0,0,.16)); }
.window .side { width: 196px; }
.ph .scr { position: absolute; left: 5.333%; top: 2.5%; width: 89.334%; height: 95%; border-radius: 15.8% / 7.3%; overflow: hidden; background: var(--tile); display: grid; place-items: center; text-align: center; font-size: 12px; font-weight: 500; color: var(--muted); padding: 8px; }
.ph .scr.has { padding: 0; display: block; }
.ph .scr img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.ph .frame { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; list-style: none; padding: 0; }
.step { background: var(--card); border-radius: 24px; box-shadow: var(--lift); padding: 12px 12px 24px; }
.tile { background: var(--tile); border-radius: 16px; padding: 28px 16px; display: grid; place-items: center; margin-bottom: 16px; }
.tile .ph { width: 188px; }
.tile .scr { background: var(--card); }
.step i { font-style: normal; font-weight: 600; font-size: 12px; width: 24px; height: 24px; border-radius: 50%; background: var(--tile); display: grid; place-items: center; margin: 0 8px; }
.step h3 { font-size: 18px; letter-spacing: -.01em; margin: 12px 8px 4px; }
.step p { font-size: 15px; color: var(--muted); margin: 0 8px; }

.bento { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
.bcard { background: var(--card); border-radius: 24px; box-shadow: var(--lift); padding: 32px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
.bcard h3 { font-size: 21px; letter-spacing: -.02em; line-height: 1.2; }
.bcard p { font-size: 15px; color: var(--muted); max-width: 26em; }
.bcard .ph { margin-top: 16px; width: 196px; }
/* Phones line up along the bottom of a row, however long the text above. */
.bcard:not(.span) p { margin-bottom: 8px; }
.bcard:not(.span) .ph { margin-top: auto; }
.bcard.span { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; text-align: left; gap: 32px; padding: 40px 64px; }
.bcard.span > div:first-child { display: flex; flex-direction: column; gap: 8px; }
.bcard.span h3 { font-size: 30px; }
.bcard.span p { font-size: 17px; }
.bcard.span .ph { margin: 0; width: 232px; }
.bcard.span.flip { flex-direction: row-reverse; }
.bento.three { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

.ctrl { display: grid; grid-template-columns: 1fr 1.3fr; gap: 32px; background: var(--card); border-radius: 24px; box-shadow: var(--lift); padding: 40px; }
.more { display: inline-block; margin-top: 12px; font-size: 15px; font-weight: 600; text-underline-offset: 3px; }
.ticks { list-style: none; padding: 0; }
.ticks li { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ticks li:first-child { padding-top: 0; } .ticks li:last-child { border-bottom: 0; padding-bottom: 0; }
.ticks svg { width: 20px; height: 20px; flex: none; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-top: 2px; }

.mid { text-align: center; }
.faq { max-width: 640px; margin: 24px auto 0; }
.q { border-bottom: 1px solid var(--line); }
.q h3 { font-size: 16px; }
.q button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; font-weight: 600; }
.q button:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; border-radius: 8px; }
/* The plus turns into a minus: its upright bar swings flat. */
.q .ic { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--tile); position: relative; }
.q .ic::before, .q .ic::after { content: ""; position: absolute; left: 9px; top: 13px; width: 10px; height: 2px; border-radius: 1px; background: var(--text); transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
.q .ic::after { transform: rotate(90deg); }
.q.open .ic::after { transform: rotate(0deg); }
/* The answer slides open: its row grows from nothing to its own height. */
.q .a { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .35s cubic-bezier(.2, .8, .2, 1); }
.q .a > div { overflow: hidden; transition: opacity .25s ease, visibility .35s; }
.js .q:not(.open) .a { grid-template-rows: 0fr; }
.js .q:not(.open) .a > div { opacity: 0; visibility: hidden; }
.q p { color: var(--muted); padding: 0 44px 16px 0; }
@media (prefers-reduced-motion: reduce) { .q .a, .q .a > div, .q .ic::before, .q .ic::after { transition: none; } }

.close { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
footer { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 72px 24px 40px; font-size: 14px; color: var(--muted); text-align: center; }
footer .wm { color: var(--text); font-size: 26px; }
footer div { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; }

/* The invite and post link page. */
.inv { max-width: 440px; margin: 40px auto 0; background: var(--card); border-radius: 28px; box-shadow: var(--lift); padding: 40px 24px 24px; text-align: center; }
.at { width: 72px; height: 72px; border-radius: 50%; background: var(--tile); display: grid; place-items: center; font-weight: 700; font-size: 28px; margin: 0 auto 16px; }
.inv h1 { font-size: 30px; }
.inv .lead { margin: 8px auto 20px; font-size: 16px; }
.inv ol { list-style: none; padding: 0; text-align: left; margin-top: 24px; border-top: 1px solid var(--line); }
.inv li { display: flex; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); font-size: 15px; }
.inv li:last-child { border-bottom: 0; }
.inv li i { font-style: normal; font-weight: 600; font-size: 12px; width: 24px; height: 24px; flex: none; border-radius: 50%; background: var(--tile); display: grid; place-items: center; }
.inv .get { width: 100%; justify-content: center; }
[hidden] { display: none !important; }

/* The privacy policy and terms. */
.legal { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; align-items: start; margin-top: 40px; }
.toc { position: sticky; top: 88px; font-size: 14px; }
.toc b { display: block; margin-bottom: 8px; }
.toc a { display: block; padding: 4px 0; color: var(--muted); text-decoration: none; }
.toc a:hover { color: var(--text); }
.doc { background: var(--card); border-radius: 28px; box-shadow: var(--lift); padding: 40px; line-height: 1.6; }
.doc > * { max-width: 68ch; }
.doc h1 { font-size: 32px; letter-spacing: -.02em; margin-bottom: 16px; }
.doc h2 { font-size: 21px; letter-spacing: -.01em; margin: 32px 0 8px; }
.doc h3 { font-size: 16px; margin: 24px 0 8px; }
.doc p, .doc ul { margin-bottom: 16px; }
.doc ul { padding-left: 20px; }
.doc li { margin-bottom: 4px; }
.doc .wide { max-width: none; overflow-x: auto; }
.doc table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 15px; }
.doc th, .doc td { text-align: left; vertical-align: top; padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); }

@media (max-width: 720px) {
  .wrap { padding: 0 16px; }
  .cap { gap: 16px; padding: 0 20px 0 16px; }
  .cap a:not(.wm):not(.get) { font-size: 13px; }
  .cap.has-get a:not(.wm):not(.get) { display: none; }
  .hero { padding-top: 40px; }
  section { padding-top: 56px; }
  .window { border-radius: 24px; padding: 32px 16px; }
  .window .side { display: none; }
  .steps, .bento { grid-template-columns: 1fr; }
  .bcard, .bcard.span, .bcard.span.flip { flex-direction: column; text-align: center; padding: 28px; }
  .bcard.span h3 { font-size: 23px; } .bcard.span p { font-size: 15px; }
  .bcard.span .ph { margin-top: 16px; width: 196px; }
  .ctrl { grid-template-columns: 1fr; padding: 24px; gap: 20px; }
  .legal { grid-template-columns: 1fr; gap: 16px; margin-top: 24px; }
  .toc { position: static; background: var(--card); border-radius: 20px; box-shadow: var(--lift); padding: 20px; }
  .doc { padding: 28px 20px; border-radius: 24px; }
}
</style>
</head>
<body>
<nav class="cap" aria-label="Cheers"><a class="wm" href="/">Cheers</a><a href="/#how">How it works</a><a href="/#questions">Questions</a></nav>
<main class="wrap">
<div class="inv">
  <div class="at" id="at">@</div>
  <h1 id="title">Open this in Cheers</h1>
  <p class="lead" id="lead">This link opens in the Cheers app.</p>
  <span class="tag">Coming soon to iPhone</span>
  <ol id="steps" hidden><li><i>1</i>Get Cheers on your iPhone</li><li><i>2</i>Open the Friends page</li><li><i>3</i><span id="search"></span></li></ol>
</div>
<script>
  var address = location.pathname;
  var person = address.match(/^\/u\/([A-Za-z0-9_]{3,15})\/?$/);
  var post = /^\/p\//.test(address);
  var at = document.getElementById("at");
  if (person) {
    document.getElementById("title").textContent = "Add @" + person[1] + " on Cheers";
    document.getElementById("lead").textContent = "Cheers is where you rate your drinks and share them with friends.";
    document.getElementById("search").textContent = "Search for @" + person[1] + " and add them";
    document.getElementById("steps").hidden = false;
  } else if (post) {
    at.hidden = true;
  } else {
    at.hidden = true;
    document.getElementById("title").textContent = "Page not found";
    document.getElementById("lead").textContent = "There’s nothing at this address.";
  }
</script>
</main>
<footer><a class="wm" href="/">Cheers</a><div><a href="/privacy/">Privacy policy</a><a href="/terms/">Terms</a><a href="mailto:hello@cheers-drinks.co.uk">Contact</a></div><span>For people aged 18 and over</span></footer>
</body>
</html>
